name: 打包插件

on:
  push:
    branches: [main]
    paths: ["addon/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 壓縮
        run: |
          cd addon
          zip -r ../ShengLeveling.zip ShengLeveling
      - name: 更新「最新版」發佈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^## Version:' addon/ShengLeveling/ShengLeveling.toc | cut -d' ' -f3 | tr -d '\r')
          notes="版本 ${ver}（${GITHUB_SHA::7}）。解壓縮後把 ShengLeveling 資料夾放進 World of Warcraft\\_forever_\\Interface\\AddOns，完整重開遊戲。"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ShengLeveling.zip --clobber
            gh release edit latest --title "最新版 ${ver}" --notes "$notes"
          else
            gh release create latest ShengLeveling.zip --title "最新版 ${ver}" --notes "$notes" --latest
          fi
          git tag -f latest
          git push -f origin latest
      - name: 版本號有變就上傳 CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          CF_PROJECT: ${{ vars.CF_PROJECT_LEVELING }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_GAME_VERSION" ] || [ -z "$CF_PROJECT" ]; then echo "還沒設定 CurseForge，跳過"; exit 0; fi
          toc=addon/ShengLeveling/ShengLeveling.toc
          ver=$(grep -m1 '^## Version:' "$toc" | cut -d' ' -f3 | tr -d '\r')
          old=$(git show "HEAD~1:$toc" 2>/dev/null | grep -m1 '^## Version:' | cut -d' ' -f3 | tr -d '\r' || true)
          if [ "$ver" = "$old" ] && [ "$FORCE" != "true" ]; then echo "版本 $ver 沒變，跳過"; exit 0; fi
          # 版本號帶 beta（例如 0.3.0-beta）才發測試版，其餘都發正式版
          case "$ver" in *beta*) rt=beta;; *) rt=release;; esac
          cp ShengLeveling.zip "ShengLeveling-$ver.zip"
          # 每一行變成一個項目（CurseForge 的 markdown 會把單一換行併成同一段）
          log=$(git log -1 --format=%B | sed -E '/^[[:space:]]*$/b; /^(#|- |\* )/b; s/^/- /')
          jq -n --arg log "$log" --arg name "ShengLeveling $ver" --argjson gv "[$CF_GAME_VERSION]" --arg rt "$rt" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $gv, releaseType: $rt}' > meta.json
          curl -sS -f -H "X-Api-Token: $CF_API_TOKEN" -F "metadata=<meta.json" -F "file=@ShengLeveling-$ver.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT/upload-file"
