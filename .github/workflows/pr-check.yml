name: PR 檢查

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 驗證路線與角色模擬
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          bash tools/tests/run-all.sh
